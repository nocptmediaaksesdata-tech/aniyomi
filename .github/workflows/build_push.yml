name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build app
        run: ./gradlew assembleRelease -Penable-updater

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # Sign APK and create release for tags

      - name: Get tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -x
          echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Prepare Signing Key
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "Using repository secrets for signing"
            echo "SIGNING_KEY=${{ secrets.SIGNING_KEY }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ALIAS }}" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using default fallback keystore for fork release"
            FALLBACK_KEY=$(base64 -w 0 .github/keystore/release.jks)
            echo "SIGNING_KEY=$FALLBACK_KEY" >> $GITHUB_ENV
            echo "KEY_ALIAS=aniyomi" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=aniyomi-watchparty" >> $GITHUB_ENV
            echo "KEY_PASSWORD=aniyomi-watchparty" >> $GITHUB_ENV
          fi

      - name: Sign APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ env.SIGNING_KEY }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e

          for arch in universal arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f "app/build/outputs/apk/release/app-${arch}-release-unsigned-signed.apk" ]; then
              src="app/build/outputs/apk/release/app-${arch}-release-unsigned-signed.apk"
            else
              src="app/build/outputs/apk/release/app-${arch}-release-unsigned.apk"
            fi

            if [ "$arch" = "universal" ]; then
              dest="aniyomi-${{ env.VERSION_TAG }}.apk"
              mv "$src" "$dest"
              echo "APK_UNIVERSAL_SHA=$(sha256sum "$dest" | awk '{ print $1 }')" >> $GITHUB_ENV
            else
              dest="aniyomi-${arch}-${{ env.VERSION_TAG }}.apk"
              mv "$src" "$dest"
              var_name="APK_$(echo "$arch" | tr '[:lower:]-' '[:upper:]_')_SHA"
              echo "${var_name}=$(sha256sum "$dest" | awk '{ print $1 }')" >> $GITHUB_ENV
            fi
          done

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Aniyomi ${{ env.VERSION_TAG }}
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }}
            | x86_64 | ${{ env.APK_X86_64_SHA }} |
          files: |
            aniyomi-${{ env.VERSION_TAG }}.apk
            aniyomi-arm64-v8a-${{ env.VERSION_TAG }}.apk
            aniyomi-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            aniyomi-x86-${{ env.VERSION_TAG }}.apk
            aniyomi-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
